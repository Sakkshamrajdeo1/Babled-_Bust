<script>

addEventListener('resize',rs);rs();

  for(const k in pm){G.prof[k]=(G.prof[k]||0)*.7+pm[k];pm[k]=0}G.prof.m=(G.prof.m||0)+1;G.sk=clamp(G.sk+(w?(sc[1]===0?.1:.05):-.08),.7,2.5);if(!G.hist)G.hist=[];G.hist.push(JSON.parse(JSON.stringify(G.ly)));if(G.hist.length>6)G.hist.shift();

function update(dt){

    if(ptr){const dx=(ptr.x-cx)/R-P.x,dy=(ptr.y-cy)/R-P.y,d=Math.hypot(dx,dy)||1,k=Math.min(1,d*3)*(P.an>0?.2:1);P.vx+=dx/d*k*3.6*P.spd*dt;P.vy+=dy/d*k*3.6*P.spd*dt}
    let tx=P.x,ty=P.y;const tc=EB.tac;if(P.air>0){tx=P.tx;ty=P.ty}if(tc==='flee'&&P.ab>0){tx=-P.x;ty=-P.y}if(P.sh>0){tx=0;ty=0}if(E.spin<35||E.burst<35){tx=0;ty=0}
    tx+=Math.sin(T*1.3)*.25;
    const ax=tx-E.x,ay=ty-E.y,ad=Math.hypot(ax,ay)||1;E.vx+=ax/ad*1.8*E.spd*(1+.02*Math.min(G.lv,200))*dt;E.vy+=ay/ad*1.8*E.spd*(1+.02*Math.min(G.lv,200))*dt;

    E.en=Math.min(100,E.en+dt*(1.5+.2*G.lv));const rd=Math.hypot(P.x-E.x,P.y-E.y);

    if((E.spin<45||(tc==='guard'&&rd<.6))&&E.an<=0&&Math.random()<dt*1.5)useAnchor(E);
    if((G.lv>=8||tc==='chase')&&rd<.8&&Math.random()<dt)useBlitz(E);
    E.acd-=dt;if((G.lv>=10||tc==='air')&&E.air<=0&&E.acd<=0&&rd<1.4&&Math.random()<dt*(tc==='air'?.9:.4)){E.air=1.2;E.tx=P.x;E.ty=P.y;msg='Rival leaps!';msgT=1}
    if((G.lv>=12||tc==='flee')&&E.spin<50&&E.ab<=0&&Math.random()<dt)useAbsorb(E);
    P.en=Math.min(100,P.en+dt*3);
  }
  for(const t of [P,E]){
    if(t.air>0&&!t.dead&&st==='play'){t.air-=dt;t.vx=t.vy=0;if(t.air>.5){if(t===E){t.tx=P.x;t.ty=P.y}else if(ptr){t.tx=clamp((ptr.x-cx)/R,-.9,.9);t.ty=clamp((ptr.y-cy)/R,-.9,.9)}}t.x+=(t.tx-t.x)*Math.min(1,4*dt);t.y+=(t.ty-t.y)*Math.min(1,4*dt);if(t.air<=0){t.air=0;slam(t)}continue}

function drawArena(){

  g.strokeStyle='#2a3566';g.lineWidth=.03;g.stroke();

  g.strokeStyle='rgba(140,170,255,.2)';g.lineWidth=.012;
  for(const r of [.35,.68]){g.beginPath();g.arc(0,0,r,0,7);g.stroke()}
  for(let i=0;i<16;i++){const a=i*Math.PI/8+(stg===3?T*.6:0);g.beginPath();g.moveTo(Math.cos(a)*.72,Math.sin(a)*.72);g.lineTo(Math.cos(a)*.94,Math.sin(a)*.94);g.stroke()}
  g.save();g.shadowColor='#ffc531';g.shadowBlur=14;g.strokeStyle='#ffc531';g.lineWidth=.025;g.beginPath();g.arc(0,0,1,0,7);g.stroke();g.restore();
  g.fillStyle='rgba(255,197,49,.25)';g.beginPath();g.arc(0,0,.06,0,7);g.fill();stageFx();
}
function drawTop(t){
  if(t.dead)return;
  g.lineCap='round';
  for(let i=1;i<t.tr.length;i++){g.strokeStyle=t.c;g.globalAlpha=i/t.tr.length*.35*t.al;g.lineWidth=t.r*.5*i/t.tr.length;g.beginPath();g.moveTo(t.tr[i-1][0],t.tr[i-1][1]);g.lineTo(t.tr[i][0],t.tr[i][1]);g.stroke()}
  g.save();g.globalAlpha=t.al;g.translate(t.x,t.y);if(t.air>0){const h=Math.sin(Math.PI*(1-t.air/1.2));g.translate(0,-h*.28);g.scale(1+.5*h,1+.5*h)}
  g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.arc(.02,.03,t.r,0,7);g.fill();
  const w=t.spin<30?Math.sin(T*30)*(30-t.spin)/30*.014:0;g.translate(w,w*.5);

  g.shadowBlur=0;
  g.fillStyle=met(t.r*.82);g.beginPath();g.arc(0,0,t.r*.82,0,7);g.fill();
  g.strokeStyle=t.c;g.lineWidth=t.r*.06;g.stroke();
  g.fillStyle=t.a;g.beginPath();g.arc(0,0,t.r*.58,0,7);g.fill();
  g.lineWidth=t.r*.05;
  for(let i=0;i<3;i++){g.rotate(2.0944);g.beginPath();g.moveTo(0,0);g.lineTo(t.r*.58,0);g.stroke()}
  g.fillStyle='#e9eefc';g.beginPath();g.arc(0,0,t.r*.2,0,7);g.fill();
  g.fillStyle=t.c;g.beginPath();g.arc(0,0,t.r*.09,0,7);g.fill();
  if(t.up)upg(t.up,t.r,-1);g.strokeStyle='rgba(255,255,255,.4)';g.lineWidth=t.r*.05;g.beginPath();g.arc(0,0,t.r*.72,3.6,4.6);g.stroke();g.rotate(-t.ang);
